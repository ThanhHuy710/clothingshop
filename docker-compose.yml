version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: webmaymac-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clothing_store
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/clothing_store.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - webmaymac-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Backend Spring Boot Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webmaymac-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: jdbc:mysql://mysql:3306/clothing_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      JWT_ACCESS_SECRET: very-secure-secret-key-that-is-at-least-32-bytes-long-123456
      JWT_ACCESS_EXPIRATION: 86400000
      JWT_REFRESH_EXPIRATION: 2592000000
      CLOUDINARY_CLOUD_NAME: hqiqib7n
      CLOUDINARY_API_KEY: "288317817894312"
      CLOUDINARY_API_SECRET: J6dsAUdBlaLuIITt3r9Sh8E2BiQ
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost
    networks:
      - webmaymac-net

  # ----------------------------------------------------------------------------
  # Frontend React / Vite Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: webmaymac-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - webmaymac-net

volumes:
  mysql_data:

networks:
  webmaymac-net:
    driver: bridge
