# ==============================================================================
# Render Blueprint Specification (render.yaml)
# Allows 1-Click deployment of WebMayMac fullstack services on Render.com
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Service (Spring Boot - Docker Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: webmaymac-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    healthCheckPath: /api/products
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRATION
        value: 86400000
      - key: JWT_REFRESH_EXPIRATION
        value: 2592000000
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Service (React / Vite - Static Site: 100% Free on Render)
  # ----------------------------------------------------------------------------
  - type: static
    name: webmaymac-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
